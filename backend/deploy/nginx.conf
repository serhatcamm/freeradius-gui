# FreeRADIUS web panel - reverse proxy.
#
# Terminates TLS and forwards to the local uvicorn instance. The panel binds
# to 127.0.0.1 only, so it is unreachable without this vhost.
#
# Enable with:
#   ln -s /etc/nginx/sites-available/freeradius-web /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream freeradius_web {
    server 127.0.0.1:8080 fail_timeout=5s;
    keepalive 8;
}

server {
    # This host serves nothing else, so the panel takes the bare-IP request too.
    # Without default_server, Debian's stock "default" site would win instead.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenges stay on plain HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Point these at your certificates before enabling the site, or drop the
    # ssl_* lines and serve plain HTTP on 8080 directly for a trial run.
    ssl_certificate     /etc/ssl/certs/freeradius-web.crt;
    ssl_certificate_key /etc/ssl/private/freeradius-web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Configuration files can be large on busy servers.
    client_max_body_size 2m;

    access_log /var/log/nginx/freeradius-web.access.log;
    error_log  /var/log/nginx/freeradius-web.error.log;

    location / {
        proxy_pass http://freeradius_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # The SPA is served by the app itself; do not let nginx cache it.
        proxy_buffering off;
    }
}